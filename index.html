<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Showcase</title>
    <!-- Import the model-viewer web component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <!-- IMPORTANT: Change 'car-model.glb' to the exact name of your uploaded file -->
    <model-viewer 
        src="car-model.glb" 
        alt="3D Car Model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1"
        environment-image="neutral">
    </model-viewer>
</body>
</html>
